version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # TS is pinned per-package on purpose: tsup --dts needs 5.x,
      # the Angular compiler needs exactly 6.0.x. Bump manually.
      - dependency-name: typescript
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
