# Keep next = main + beta work. Every push to main merges into next
# (scripts/sync-next.sh), then kicks CI + Release on next — pushes made with
# GITHUB_TOKEN do not trigger workflows on their own.
name: Sync main into next

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-next

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Merge main into next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # a push to next during the merge (a beta release, an upstream sync)
          # rejects ours; start over from the new tip
          for attempt in 1 2 3; do
            git fetch origin main next
            git reset -q --hard origin/next
            before=$(git rev-parse HEAD)
            # run main's copy: next may not have the script (or its latest version)
            bash <(git show origin/main:scripts/sync-next.sh)
            [ "$(git rev-parse HEAD)" = "$before" ] && exit 0
            if git push origin HEAD:next; then
              gh workflow run ci.yml --ref next
              gh workflow run release.yml --ref next
              exit 0
            fi
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
