# Builds the Astro docs and deploys to Cloudflare Pages.
# Triggers: normal pushes to main (docs/assets/packages changes),
# manual dispatch, and workflow_call from release.yml after a stable
# publish (the version-snapshot commit is pushed with GITHUB_TOKEN,
# which never triggers push workflows — hence the explicit call).
name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'assets/**', 'packages/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Check Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy."
          fi

      - name: Ensure Cloudflare Pages project exists
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create fluentui-emoji --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=fluentui-emoji
