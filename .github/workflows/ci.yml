name: CI

on:
  pull_request:
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: Validate packaging (publint + arethetypeswrong)
        run: |
          for dir in packages/*/; do
            echo "--- publint $dir"
            (cd "$dir" && pnpm dlx publint --strict) || exit 1
          done
          for dir in packages/*/; do
            echo "--- attw $dir"
            (cd "$dir" && pnpm dlx @arethetypeswrong/cli --pack . --profile node16) || exit 1
          done
