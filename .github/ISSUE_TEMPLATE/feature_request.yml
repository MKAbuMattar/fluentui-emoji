name: Feature request
description: A new framework package, API, or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you want?
      description: The use case first, then the proposed API if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
